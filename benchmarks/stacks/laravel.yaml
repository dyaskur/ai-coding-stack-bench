id: laravel
language: php
language_version: "8.3"
framework: laravel
framework_version: "11"
description: PHP 8.3 with Composer and Laravel 11, backed by MySQL.
# Built from laravel/Dockerfile (PHP extensions + pinned Composer).
dockerfile: laravel/Dockerfile
build_context: laravel/
workdir: /workspace
environment_notes: |
  - MySQL 8.4 is running at host "mysql", port 3306. Its settings are in the
    DB_CONNECTION, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME and DB_PASSWORD
    environment variables.
  - PHP 8.3 with pdo_mysql, zip, intl, bcmath and pcntl, and Composer 2.8 are installed.
    Create the Laravel 11 project in the current directory with Composer (it already
    holds a .git folder, so create it elsewhere and move it in if needed).
  - In start.sh, use php artisan serve --no-reload so the server keeps the
    provided DB_* environment variables. Laravel 11 otherwise drops them when
    a scaffolded .env file exists, causing migrations and HTTP requests to use
    different databases.
  - The required HTTP paths start at /projects, not /api/projects. Laravel
    adds /api to routes/api.php by default; set apiPrefix to an empty string
    in bootstrap/app.php or register those routes without that prefix.
env:
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: bench
  DB_USERNAME: bench
  DB_PASSWORD: bench
services:
  - name: mysql
    image: mysql:8.4.3
    env:
      MYSQL_DATABASE: bench
      MYSQL_USER: bench
      MYSQL_PASSWORD: bench
      MYSQL_ROOT_PASSWORD: root
    ports: [3306]
    healthcheck: [mysqladmin, ping, -h, 127.0.0.1]
resources:
  cpus: 2
  memory: 4g
