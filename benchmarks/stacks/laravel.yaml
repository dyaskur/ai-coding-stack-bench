id: laravel
language: php
language_version: "8.3"
framework: laravel
framework_version: "11"
description: PHP 8.3 with Composer and Laravel 11, backed by MySQL.
image: php:8.3.13-cli-bookworm
workdir: /workspace
env:
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_DATABASE: bench
  DB_USERNAME: bench
  DB_PASSWORD: bench
services:
  - name: mysql
    image: mysql:8.4.3
    env:
      MYSQL_DATABASE: bench
      MYSQL_USER: bench
      MYSQL_PASSWORD: bench
      MYSQL_ROOT_PASSWORD: root
    ports: [3306]
    healthcheck: [mysqladmin, ping, -h, 127.0.0.1]
resources:
  cpus: 2
  memory: 4g
