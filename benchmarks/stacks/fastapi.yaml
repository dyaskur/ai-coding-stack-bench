id: fastapi
language: python
language_version: "3.12"
framework: fastapi
framework_version: "0.115"
description: Python 3.12 with FastAPI, uvicorn and pytest, backed by PostgreSQL.
# Built from fastapi/Dockerfile; the preinstalled versions are in fastapi/requirements.txt.
dockerfile: fastapi/Dockerfile
build_context: fastapi/
workdir: /workspace
environment_notes: |
  - PostgreSQL 16 is running at host "postgres", port 5432. Its connection URL is in
    the DATABASE_URL environment variable (postgresql://user:password@host:port/db).
  - Preinstalled Python packages (pinned): fastapi, uvicorn, pydantic, pydantic-settings,
    sqlalchemy, alembic, psycopg (v3), httpx and pytest. pip installs extra packages for
    your user. Commit any extra dependencies to requirements.txt.
env:
  DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
setup_commands: []
services:
  - name: postgres
    image: postgres:16.4-alpine
    env:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports: [5432]
    healthcheck: [pg_isready, -U, bench]
resources:
  cpus: 2
  memory: 4g
